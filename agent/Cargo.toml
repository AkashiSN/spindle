[package]
name = "spindle-agent"
version = "0.1.0"
edition = "2021"
description = "spindle の端末（iPhone）を Mac のミュージック.app へ反映するエージェント"
license = "MIT"
publish = false

[lib]
name = "spindle_agent"
path = "src/lib.rs"

[[bin]]
name = "spindle-agent"
path = "src/main.rs"

[features]
# 偽のミュージック.app と偽のサーバ（spindle 本体の結合試験から使う）
fake = []

[dependencies]
agent-proto = { version = "0.1.0", path = "../agent-proto" }
caseless = "0.2.2"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider", "http2"] }
rustix = { version = "1.1.5", features = ["fs", "std"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"

[dev-dependencies]
tempfile = "3.27.0"
