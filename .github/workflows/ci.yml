name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/akashisn/spindle

jobs:
  web:
    name: web (lint / typecheck / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npx vitest run
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  rust:
    name: rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # フィンガープリントのテスト（tests/fingerprint.rs）が FLAC / ALAC / Opus / MP3 / AAC の
      # 生成に ffmpeg を使い、正規化のテスト（tests/normalize.rs / encode.rs）が flac を使う。
      # 無いと該当テストは skip されるので、CI では必ず入れる
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg flac
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  docker:
    # イメージを 1 回だけビルドして起動確認する（PR でも走る。書き込み権限は持たない）。push は別ジョブ
    # publish が、ここで確認した同じイメージ（docker save の成果物）を GHCR へ複製する（P4-12、D-79）
    name: docker build + /health
    runs-on: ubuntu-latest
    needs: [web, rust]
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # git describe のため
      - name: 版（git describe --tags --always）と、v* タグなら vX.Y.Z の形の検査
        id: version
        run: |
          set -eu
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          release=false
          case "$GITHUB_REF" in
            refs/tags/v*)
              if echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                release=true
              else
                echo "::error::リリースタグは vX.Y.Z の形だけ: $GITHUB_REF_NAME"; exit 1
              fi ;;
          esac
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.version.outputs.release == 'true' }}
          labels: |
            org.opencontainers.image.title=spindle
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          platforms: linux/amd64
          tags: |
            spindle:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SPINDLE_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: コンテナを起動して /health（version 込み）・ロックモード・ログイン・ジョブ API・同梱 SPA を確認
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          root=$(mktemp -d)
          for d in library derived archive inbox playlists data; do mkdir -p "$root/$d"; done
          cp deploy/config.example.toml "$root/data/config.toml"
          chmod -R a+rwX "$root"
          run_container() {
            docker run -d --name spindle-ci "$@" \
              -u 1000:1000 \
              -v "$root/library:/library" -v "$root/derived:/derived" -v "$root/archive:/archive" \
              -v "$root/inbox:/inbox" -v "$root/playlists:/playlists" -v "$root/data:/data" \
              -p 18080:8080 spindle:ci
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:18080/health; then echo; ok=1; break; fi
              sleep 1
            done
            docker logs spindle-ci
            test "$ok" = 1
          }
          code() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }

          # 0. --version は設定無しで版を出す。イメージの版と一致する
          test "$(docker run --rm spindle:ci --version)" = "spindle $EXPECTED_VERSION"

          # 1. パスワード未設定 → ロックモード: /health は locked、SPA を含め他は 503
          run_container
          curl -fsS http://127.0.0.1:18080/health | grep -q '"status":"locked"'
          test "$(code http://127.0.0.1:18080/)" = 503
          test "$(code http://127.0.0.1:18080/api/tracks)" = 503
          docker rm -f spindle-ci

          # 2. 初期パスワードを与えて起動 → 未認証 401、ログイン → セッションで 200、CSRF 403。
          #    /health は version（ビルド時に焼いた git describe）と yt-dlp の版（同梱の yt-dlp）を返す
          run_container -e SPINDLE_INITIAL_PASSWORD=ci-password
          health=$(curl -fsS http://127.0.0.1:18080/health)
          echo "$health" | grep -q '"status":"ok"'
          echo "$health" | grep -q "\"version\":\"$EXPECTED_VERSION\""
          echo "$health" | grep -Eq '"ytdlp":"[0-9]{4}\.[0-9]{2}\.[0-9]{2}'
          test "$(code http://127.0.0.1:18080/api/auth/session)" = 401
          jar=$(mktemp)
          test "$(code -c "$jar" -H 'Sec-Fetch-Site: none' -H 'Content-Type: application/json' \
            -d '{"password":"ci-password"}' http://127.0.0.1:18080/api/auth/login)" = 200
          grep -q spindle_session "$jar"
          test "$(code -b "$jar" http://127.0.0.1:18080/api/auth/session)" = 200
          # ジョブ API: 未認証 401、セッションで一覧 + summary、SSE は text/event-stream、存在しない id は 404
          test "$(code http://127.0.0.1:18080/api/jobs)" = 401
          curl -fsS -b "$jar" http://127.0.0.1:18080/api/jobs | grep -q '"summary"'
          curl -sS -b "$jar" -m 2 -o /dev/null -w '%{content_type}\n' http://127.0.0.1:18080/api/events | grep -q '^text/event-stream'
          test "$(code -b "$jar" -X POST -H 'Origin: http://127.0.0.1:18080' http://127.0.0.1:18080/api/jobs/424242/cancel)" = 404
          test "$(code -b "$jar" -X POST -H 'Origin: http://evil.example' http://127.0.0.1:18080/api/auth/logout)" = 403
          test "$(code -b "$jar" -X POST -H 'Origin: http://127.0.0.1:18080' http://127.0.0.1:18080/api/auth/logout)" = 204

          # 3. 同梱 SPA: index.html、それが参照する hashed asset、クライアントルート、/api の JSON 404
          index=$(mktemp)
          curl -fsS -o "$index" -w '%{content_type}\n' http://127.0.0.1:18080/ | grep -q '^text/html'
          asset=$(grep -o '/assets/[^"]*\.js' "$index" | head -n1)
          test -n "$asset"
          curl -fsS -o /dev/null -w '%{content_type}\n' "http://127.0.0.1:18080$asset" | grep -q 'javascript'
          curl -fsS -o /dev/null -w '%{content_type}\n' http://127.0.0.1:18080/some/client/route | grep -q '^text/html'
          test "$(code -b "$jar" http://127.0.0.1:18080/api/nope)" = 401
          docker rm -f spindle-ci

          # 4. 再起動: 環境変数なしでも DB のパスワードでロックされない
          run_container
          curl -fsS http://127.0.0.1:18080/health | grep -q '"status":"ok"'
          docker rm -f spindle-ci

      - name: 起動確認に通ったイメージを publish ジョブへ渡す（push イベントだけ）
        if: github.event_name == 'push'
        run: docker save spindle:ci | zstd -T0 -3 -o image.tar.zst
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: image
          path: image.tar.zst
          retention-days: 1

  publish:
    # 書き込み権限（GHCR / Release）はこのジョブだけ。main への push（edge / sha-<7 桁>）と vX.Y.Z タグ
    # （X.Y.Z / X.Y / latest + Release）で走り、PR では走らない。docker ジョブが確認した同じイメージ
    # （docker save の成果物）を skopeo で複製するので二度ビルドしない。docker push は buildx で load した
    # イメージを GHCR に押すと「unknown blob」で落ちることがある
    name: publish (GHCR)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push'
    permissions:
      contents: write     # vX.Y.Z の Release
      packages: write     # GHCR
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
      - name: GHCR へ複製（全タグ同じ digest）
        id: push
        env:
          TAGS: ${{ needs.docker.outputs.tags }}
          CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          command -v skopeo >/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo)
          zstd -d image.tar.zst -o image.tar
          echo "$TAGS" | while read -r tag; do
            [ -n "$tag" ] || continue
            skopeo copy --dest-creds "$CREDS" docker-archive:image.tar "docker://$tag"
          done
          first=$(echo "$TAGS" | head -n1)
          digest=$(skopeo inspect --creds "$CREDS" --format '{{.Digest}}' "docker://$first")
          echo "pushed: ${first%%:*}@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "digest=${IMAGE}@$digest" >> "$GITHUB_OUTPUT"
      - name: GitHub Release（vX.Y.Z タグ。自動生成のノート + イメージのタグと digest）
        if: needs.docker.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          notes=$(printf 'Docker image: `%s`\n\n```\n%s\n```\n' "${IMAGE}:${GITHUB_REF_NAME#v}" "$DIGEST")
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --notes "$notes"
