[package]
name = "spindle"
version = "0.1.0"
edition = "2021"
description = "TrueNAS 上で動く単一コンテナの音楽ライブラリ管理アプリ"
license = "MIT"
publish = false

[workspace]
members = []

[lib]
name = "spindle"
path = "src/lib.rs"

[[bin]]
name = "spindle"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
caseless = "0.2.2"
crc32fast = "1.5.2"
ebur128 = "0.1.10"
fancy-regex = "0.19.2"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
imagesize = "0.15.0"
ipnet = { version = "2.12.2", features = ["serde"] }
lofty = "0.25.2"
md-5 = "0.11.0"
mime_guess = "2.0.5"
pest = "2.9.1"
pest_derive = "2.9.1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
rustix = { version = "1.1.4", features = ["fs", "process", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
symphonia = { version = "0.6.1", default-features = false, features = ["isomp4", "ogg", "mp3", "aac", "alac", "wav", "aiff", "pcm", "flac"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["io", "rt"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
http-body-util = "0.1.5"
lofty = "0.25.2"
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
