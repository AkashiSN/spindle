services:
  spindle:
    image: ghcr.io/akashisn/spindle:latest
    devices:
      - /dev/sr0:/dev/sr0          # CD ドライブ。ioctl / SG_IO とも sr0 に直接通る（/dev/sg* は不要）
    group_add:
      - "24"                       # host の cdrom グループ GID
    device_cgroup_rules:
      - 'b 11:* rmw'               # sr (block)
    user: "1000:1000"              # 既存ライブラリの所有者に合わせること
    volumes:
      - /mnt/ssd/media/Library:/library
      - /mnt/ssd/media/Derived:/derived
      - /mnt/hdd/media/Archive:/archive     # Archive だけ hdd プール（D-45）
      - /mnt/ssd/media/Inbox:/inbox
      - /mnt/ssd/media/Playlists:/playlists
      - /mnt/ssd/apps/spindle:/data
      - /mnt/ssd/apps/spindle/bin/spindle-ytmusic-meta:/usr/local/bin/spindle-ytmusic-meta:ro   # メタデータプラグイン（D-70）
    environment:
      # 初回起動時のみ読まれ、argon2id でハッシュして DB に保存される。以後は無視。
      # 既定値は置かない: 与えなければ compose が起動を拒む（既知パスワードでの初期化を防ぐ）。
      # 設定後はこの行を消してよい（平文が compose に残るのを避ける）
      - SPINDLE_INITIAL_PASSWORD=${SPINDLE_INITIAL_PASSWORD:?初回起動の管理パスワードを設定してください}
    ports:
      - "8080:8080"
    restart: unless-stopped
