services:
  spindle:
    image: ghcr.io/akashisn/spindle:latest
    # PID 1 を docker の init（tini）にする。spindle が PID 1 だと、ジョブの取り消しで kill した孫プロセス
    # （TERM を無視したもの）が spindle に引き取られ、ゾンビのまま残る（spindle は自分の子しか回収しない）
    init: true
    devices:
      - /dev/sr0:/dev/sr0          # CD ドライブ。ioctl / SG_IO とも sr0 に直接通る（/dev/sg* は不要）
    group_add:
      - "24"                       # host の cdrom グループ GID
    device_cgroup_rules:
      - 'b 11:* rmw'               # sr (block)
    user: "1000:1000"              # 既存ライブラリの所有者に合わせること
    volumes:
      - /mnt/ssd/media/Library:/library
      - /mnt/ssd/media/Derived:/derived
      - /mnt/hdd/media/Archive:/archive     # Archive だけ hdd プール（D-45）
      - /mnt/ssd/media/Inbox:/inbox
      - /mnt/ssd/media/Playlists:/playlists
      - /mnt/ssd/apps/spindle:/data
      # adb サイドカーの Unix ソケット（D-98）。:ro は外さないこと。localfilesystem: のソケットは
      # ADB_SERVER_SOCKET を渡してもクライアントが「サーバに繋がらなければ同じパスで自前のサーバを起こす」。
      # サイドカーが落ちている間にそれが起きると、後から戻ったサイドカーとサーバが 2 つになり、端末の監視が
      # USB を持たない方に繋がったままになる。読み取り専用なら connect() は通り、自前のサーバの起動だけが
      # Read-only file system で失敗する（未接続として扱われる）
      - adb-run:/run/adb:ro
      - /mnt/ssd/apps/spindle/bin/spindle-ytmusic-meta:/usr/local/bin/spindle-ytmusic-meta:ro   # メタデータプラグイン（D-70）
    environment:
      # 初回起動時のみ読まれ、argon2id でハッシュして DB に保存される。以後は無視。
      # 既定値は置かない: 与えなければ compose が起動を拒む（既知パスワードでの初期化を防ぐ）。
      # 設定後はこの行を消してよい（平文が compose に残るのを避ける）
      - SPINDLE_INITIAL_PASSWORD=${SPINDLE_INITIAL_PASSWORD:?初回起動の管理パスワードを設定してください}
    ports:
      - "8080:8080"
    restart: unless-stopped

  adb:
    # adb サーバだけを動かすサイドカー（D-98）。spindle と同じイメージの adb を使う（クライアントと版を揃える）。
    # network_mode: host にしないと、挿し直した端末を拾わない（USB のホットプラグの通知 = netlink の uevent が
    # 別のネットワーク名前空間に届かない）。TCP は開かず、共有ボリューム上の Unix ソケットだけで待ち受ける
    # （-a で TCP を開くと LAN から端末を操作できてしまう）
    image: ghcr.io/akashisn/spindle:latest
    network_mode: host
    init: true
    entrypoint: ["/bin/sh", "-c", "umask 000 && exec /usr/local/bin/adb -L localfilesystem:/run/adb/adb.sock nodaemon server"]
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - adb-run:/run/adb
      - /mnt/ssd/apps/spindle/adb-keys:/root/.android   # USB デバッグの許可の鍵。消すと端末で許可し直す
    device_cgroup_rules:
      - 'c 189:* rmw'              # USB（/dev/bus/usb）
    restart: unless-stopped

volumes:
  adb-run: {}
